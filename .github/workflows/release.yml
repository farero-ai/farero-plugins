name: release
# Gives each plugin version in Farero's signed plugin directory an immutable release with the
# archive that the index pins. Farero's publication pushes to main, which runs this workflow. The
# daily run makes any release that an earlier run could not make.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'farero-ai/farero-plugins'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Release each listed version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/releases.mjs
